 <!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AutoTrack · Sales Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{  --bg:#08080a;--bg2:#0d0d11;  --surface:rgba(255,255,255,0.03);--surface-hover:rgba(255,255,255,0.055);  --border:rgba(255,255,255,0.08);--border-bright:rgba(255,255,255,0.14);  --cyan:#06b6d4;--purple:#8b5cf6;--emerald:#10b981;--rose:#f43f5e;--amber:#f59e0b;  --text:#f1f5f9;--text-muted:#64748b;--text-dim:#334155;  --mono:'IBM Plex Mono',monospace;--sans:'DM Sans',sans-serif;--display:'Syne',sans-serif;  --radius:14px;--radius-sm:8px;--glass-bg:rgba(13,13,17,0.82);}html{scroll-behavior:smooth}body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;font-size:14px;line-height:1.6}body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.35}.ambient{position:fixed;top:-280px;left:50%;transform:translateX(-50%);width:860px;height:560px;background:radial-gradient(ellipse,rgba(6,182,212,0.065) 0%,transparent 70%);pointer-events:none;z-index:0}.app-shell{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:0 24px 80px
