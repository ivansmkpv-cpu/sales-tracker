<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    header { background: linear-gradient(135deg, #1e293b, #0f172a); padding: 20px 30px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 1.8rem; color: #38bdf8; font-weight: 700; }
    header span { color: #94a3b8; font-size: 0.9rem; }
    .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; text-align: center; transition: transform 0.2s; }
    .stat-card:hover { transform: translateY(-2px); }
    .stat-card .value { font-size: 2rem; font-weight: 700; color: #38bdf8; }
    .stat-card .label { font-size: 0.85rem; color: #94a3b8; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; }
    .stat-card.green .value { color: #4ade80; }
    .stat-card.red .value { color: #f87171; }
    .stat-card.yellow .value { color: #fbbf24; }
    .panel { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 25px; margin-bottom: 25px; }
    .panel h2 { font-size: 1.1rem; color: #cbd5e1; margin-bottom: 20px; font-weight: 600; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; align-items: end; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input, .form-group select { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px 14px; color: #e2e8f0; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
    .form-group input:focus, .form-group select:focus { border-color: #38bdf8; }
    .btn { padding: 10px 22px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: #0ea5e9; color: white; }
    .btn-primary:hover { background: #0284c7; }
    .btn-danger { background: #ef4444; color: white; padding: 6px 12px; font-size: 0.8rem; }
    .btn-danger:hover { background: #dc2626; }
    .btn-sm { padding: 5px 10px; font-size: 0.8rem; border-radius: 6px; }
    .btn-edit { background: #f59e0b; color: #000; }
    .btn-edit:hover { background: #d97706; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #0f172a; padding: 12px 15px; text-align: left; font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    td { padding: 12px 15px; border-bottom: 1px solid #1e293b; font-size: 0.9rem; }
    tr:hover td { background: #263347; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .badge-won { background: #14532d; color: #4ade80; }
    .badge-lost { background: #450a0a; color: #f87171; }
    .badge-pending { background: #422006; color: #fbbf24; }
    .badge-contacted { background: #1e3a5f; color: #60a5fa; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
    .filter-btn { padding: 6px 16px; border: 1px solid #334155; border-radius: 20px; background: transparent; color: #94a3b8; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
    .filter-btn.active, .filter-btn:hover { background: #38bdf8; border-color: #38bdf8; color: #0f172a; font-weight: 600; }
    .chart-container { display: flex; gap: 10px; align-items: flex-end; height: 120px; padding: 10px 0; }
    .chart-bar { flex: 1; background: #0ea5e9; border-radius: 4px 4px 0 0; transition: height 0.3s; position: relative; min-width: 20px; }
    .chart-bar:hover { background: #38bdf8; }
    .chart-bar span { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 0.65rem; color: #94a3b8; white-space: nowrap; }
    .empty-state { text-align: center; padding: 40px; color: #94a3b8; }
    .empty-state .icon { font-size: 3rem; margin-bottom: 10px; }
    .search-bar { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px 14px; color: #e2e8f0; font-size: 0.95rem; outline: none; margin-bottom: 15px; }
    .search-bar:focus { border-color: #38bdf8; }
    #editModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
    #editModal.open { display: flex; }
    .modal-box { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 30px; width: 90%; max-width: 500px; }
    .modal-box h3 { font-size: 1.1rem; margin-bottom: 20px; color: #e2e8f0; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn-secondary:hover { background: #475569; }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } header h1 { font-size: 1.3rem; } .stats-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
<header>
  <h1>📊 Sales Tracker</h1>
  <span id="headerDate"></span>
</header>
<div class="container">
  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card"><div class="value" id="totalLeads">0</div><div class="label">Total Leads</div></div>
    <div class="stat-card green"><div class="value" id="totalWon">0</div><div class="label">Ganados</div></div>
    <div class="stat-card red"><div class="value" id="totalLost">0</div><div class="label">Perdidos</div></div>
    <div class="stat-card yellow"><div class="value" id="totalPending">0</div><div class="label">Pendientes</div></div>
    <div class="stat-card"><div class="value" id="totalRevenue">$0</div><div class="label">Ingresos</div></div>
    <div class="stat-card"><div class="value" id="convRate">0%</div><div class="label">Tasa Conversión</div></div>
  </div>

  <!-- Add Sale Form -->
  <div class="panel">
    <h2>➕ Registrar Venta / Lead</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Cliente</label>
        <input type="text" id="clientName" placeholder="Nombre del cliente">
      </div>
      <div class="form-group">
        <label>Producto / Servicio</label>
        <input type="text" id="product" placeholder="Qué vendiste">
      </div>
      <div class="form-group">
        <label>Monto ($)</label>
        <input type="number" id="amount" placeholder="0.00" min="0">
      </div>
      <div class="form-group">
        <label>Estado</label>
        <select id="status">
          <option value="pending">Pendiente</option>
          <option value="contacted">Contactado</option>
          <option value="won">Ganado</option>
          <option value="lost">Perdido</option>
        </select>
      </div>
      <div class="form-group">
        <label>Vendedor</label>
        <input type="text" id="salesperson" placeholder="Tu nombre">
      </div>
      <div class="form-group">
        <label>Fecha</label>
        <input type="date" id="saleDate">
      </div>
      <div class="form-group" style="justify-content:flex-end">
        <button class="btn btn-primary" onclick="addSale()">Agregar</button>
      </div>
    </div>
  </div>

  <!-- Chart -->
  <div class="panel">
    <h2>📈 Ingresos por Mes</h2>
    <div class="chart-container" id="chart">
      <div class="empty-state" style="width:100%"><div class="icon">📊</div><p>Sin datos aún</p></div>
    </div>
  </div>

  <!-- Table -->
  <div class="panel">
    <h2>📋 Historial de Ventas</h2>
    <input class="search-bar" type="text" id="searchInput" placeholder="🔍 Buscar por cliente, producto o vendedor..." oninput="renderTable()">
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">Todos</button>
      <button class="filter-btn" onclick="setFilter('won', this)">Ganados</button>
      <button class="filter-btn" onclick="setFilter('lost', this)">Perdidos</button>
      <button class="filter-btn" onclick="setFilter('pending', this)">Pendientes</button>
      <button class="filter-btn" onclick="setFilter('contacted', this)">Contactados</button>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Producto</th>
            <th>Monto</th>
            <th>Estado</th>
            <th>Vendedor</th>
            <th>Fecha</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="salesTable"></tbody>
      </table>
    </div>
    <div id="emptyState" class="empty-state" style="display:none">
      <div class="icon">📭</div>
      <p>No hay ventas registradas</p>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div id="editModal">
  <div class="modal-box">
    <h3>✏️ Editar Venta</h3>
    <div class="form-grid" style="grid-template-columns:1fr 1fr">
      <div class="form-group"><label>Cliente</label><input type="text" id="editClient"></div>
      <div class="form-group"><label>Producto</label><input type="text" id="editProduct"></div>
      <div class="form-group"><label>Monto</label><input type="number" id="editAmount"></div>
      <div class="form-group"><label>Estado</label>
        <select id="editStatus">
          <option value="pending">Pendiente</option>
          <option value="contacted">Contactado</option>
          <option value="won">Ganado</option>
          <option value="lost">Perdido</option>
        </select>
      </div>
      <div class="form-group"><label>Vendedor</label><input type="text" id="editSalesperson"></div>
      <div class="form-group"><label>Fecha</label><input type="date" id="editDate"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveEdit()">Guardar</button>
    </div>
  </div>
</div>

<script>
  let sales = JSON.parse(localStorage.getItem('salesTracker') || '[]');
  let currentFilter = 'all';
  let editIndex = -1;

  document.getElementById('saleDate').valueAsDate = new Date();
  document.getElementById('headerDate').textContent = new Date().toLocaleDateString('es-ES', {weekday:'long',year:'numeric',month:'long',day:'numeric'});

  function save() { localStorage.setItem('salesTracker', JSON.stringify(sales)); }

  function addSale() {
    const client = document.getElementById('clientName').value.trim();
    const product = document.getElementById('product').value.trim();
    const amount = parseFloat(document.getElementById('amount').value) || 0;
    const status = document.getElementById('status').value;
    const salesperson = document.getElementById('salesperson').value.trim();
    const date = document.getElementById('saleDate').value;
    if (!client || !product) { alert('Cliente y Producto son requeridos'); return; }
    sales.unshift({ client, product, amount, status, salesperson, date, id: Date.now() });
    save(); renderAll();
    document.getElementById('clientName').value = '';
    document.getElementById('product').value = '';
    document.getElementById('amount').value = '';
    document.getElementById('salesperson').value = '';
    document.getElementById('saleDate').valueAsDate = new Date();
  }

  function deleteSale(id) {
    if (!confirm('¿Eliminar esta venta?')) return;
    sales = sales.filter(s => s.id !== id);
    save(); renderAll();
  }

  function openEdit(id) {
    editIndex = sales.findIndex(s => s.id === id);
    if (editIndex < 0) return;
    const s = sales[editIndex];
    document.getElementById('editClient').value = s.client;
    document.getElementById('editProduct').value = s.product;
    document.getElementById('editAmount').value = s.amount;
    document.getElementById('editStatus').value = s.status;
    document.getElementById('editSalesperson').value = s.salesperson;
    document.getElementById('editDate').value = s.date;
    document.getElementById('editModal').classList.add('open');
  }

  function closeModal() { document.getElementById('editModal').classList.remove('open'); editIndex = -1; }

  function saveEdit() {
    if (editIndex < 0) return;
    sales[editIndex] = {
      ...sales[editIndex],
      client: document.getElementById('editClient').value.trim(),
      product: document.getElementById('editProduct').value.trim(),
      amount: parseFloat(document.getElementById('editAmount').value) || 0,
      status: document.getElementById('editStatus').value,
      salesperson: document.getElementById('editSalesperson').value.trim(),
      date: document.getElementById('editDate').value
    };
    save(); renderAll(); closeModal();
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTable();
  }

  function statusBadge(s) {
    const map = { won: ['badge-won','Ganado'], lost: ['badge-lost','Perdido'], pending: ['badge-pending','Pendiente'], contacted: ['badge-contacted','Contactado'] };
    const [cls, txt] = map[s] || ['badge-pending', s];
    return '<span class="badge ' + cls + '">' + txt + '</span>';
  }

  function fmt(n) { return '$' + (n||0).toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2}); }

  function renderStats() {
    const won = sales.filter(s=>s.status==='won');
    const lost = sales.filter(s=>s.status==='lost');
    const pending = sales.filter(s=>s.status==='pending'||s.status==='contacted');
    const revenue = won.reduce((a,s)=>a+(s.amount||0),0);
    const conv = sales.length ? Math.round(won.length/sales.length*100) : 0;
    document.getElementById('totalLeads').textContent = sales.length;
    document.getElementById('totalWon').textContent = won.length;
    document.getElementById('totalLost').textContent = lost.length;
    document.getElementById('totalPending').textContent = pending.length;
    document.getElementById('totalRevenue').textContent = fmt(revenue);
    document.getElementById('convRate').textContent = conv + '%';
  }

  function renderChart() {
    const monthly = {};
    sales.filter(s=>s.status==='won').forEach(s => {
      if (!s.date) return;
      const key = s.date.substring(0,7);
      monthly[key] = (monthly[key]||0) + (s.amount||0);
    });
    const keys = Object.keys(monthly).sort().slice(-8);
    const chart = document.getElementById('chart');
    if (!keys.length) { chart.innerHTML = '<div class="empty-state" style="width:100%"><div class="icon">📊</div><p>Sin datos aún</p></div>'; return; }
    const max = Math.max(...keys.map(k=>monthly[k]));
    chart.innerHTML = keys.map(k => {
      const pct = max ? (monthly[k]/max*100) : 0;
      const mo = k.split('-');
      const label = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][parseInt(mo[1])-1] + ' ' + mo[0].slice(2);
      return '<div class="chart-bar" style="height:' + pct + '%" title="' + fmt(monthly[k]) + '"><span>' + label + '</span></div>';
    }).join('');
  }

  function renderTable() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    let filtered = sales.filter(s => {
      if (currentFilter !== 'all' && s.status !== currentFilter) return false;
      if (search && !((s.client||'').toLowerCase().includes(search) || (s.product||'').toLowerCase().includes(search) || (s.salesperson||'').toLowerCase().includes(search))) return false;
      return true;
    });
    const tbody = document.getElementById('salesTable');
    const empty = document.getElementById('emptyState');
    if (!filtered.length) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    tbody.innerHTML = filtered.map(s => '<tr><td>' + (s.client||'-') + '</td><td>' + (s.product||'-') + '</td><td>' + fmt(s.amount) + '</td><td>' + statusBadge(s.status) + '</td><td>' + (s.salesperson||'-') + '</td><td>' + (s.date||'-') + '</td><td style="display:flex;gap:5px"><button class="btn btn-sm btn-edit" onclick="openEdit(' + s.id + ')">✏️</button><button class="btn btn-sm btn-danger" onclick="deleteSale(' + s.id + ')">🗑️</button></td></tr>').join('');
  }

  function renderAll() { renderStats(); renderChart(); renderTable(); }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  renderAll();
</script>
</body>
</html>
